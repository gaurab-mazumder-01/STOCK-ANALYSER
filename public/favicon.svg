<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f131b"/>
  <!-- Candle 1: Red small bear -->
  <line x1="16" y1="20" x2="16" y2="44" stroke="#ffb4ab" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="12" y="26" width="8" height="12" rx="1.5" fill="#ffb4ab"/>
  
  <!-- Candle 2: Green big bull -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#4edea3" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="28" y="18" width="8" height="24" rx="1.5" fill="#4edea3"/>
  
  <!-- Candle 3: Cyan momentum impulse -->
  <line x1="48" y1="8" x2="48" y2="42" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="44" y="12" width="8" height="20" rx="1.5" fill="#00f2fe"/>
</svg>
